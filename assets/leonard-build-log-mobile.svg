<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Leonard Sánchez — Build Log</title>
  <desc id="desc">Plano técnico móvil que conecta MI SAES 2.0, productos web y automatización.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111a"/><stop offset="1" stop-color="#0a1f2d"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#164254" opacity=".32"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="720" height="420" rx="24"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
    .signal{stroke-dasharray:8 10;animation:flow 7s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s cubic-bezier(.16,1,.3,1) infinite}.b{animation-delay:1.2s}.c{animation-delay:2.4s}
    @keyframes flow{to{stroke-dashoffset:-144}}@keyframes pulse{0%,70%,100%{opacity:.35;transform:scale(.8)}12%{opacity:1;transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){.signal,.pulse{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="720" height="420" fill="url(#panel)"/><rect width="720" height="420" fill="url(#grid)"/>
    <text class="sans" x="42" y="80" fill="#f8fafc" font-size="48" font-weight="720" letter-spacing="-1">Leonard Sánchez</text>
    <rect x="42" y="100" width="74" height="4" rx="2" fill="#22d3ee"/>
    <text class="sans" x="42" y="144" fill="#c7f9ff" font-size="18">Ingeniería en Computación</text>
    <text class="sans" x="42" y="172" fill="#8ab9c5" font-size="15">Productos web · Automatización · Educación</text>
    <g fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".72">
      <path class="signal" d="M360 284H208V342H130"/><path class="signal" d="M360 284H360V342"/><path class="signal" d="M360 284H512V342H590"/>
    </g>
    <g transform="translate(306 244)"><rect width="108" height="70" rx="14" fill="#0d2836" stroke="#22d3ee"/><circle cx="20" cy="20" r="5" fill="#22d3ee" filter="url(#glow)"/><text class="mono" x="20" y="46" fill="#f8fafc" font-size="12" font-weight="700">BUILD</text><text class="mono" x="20" y="61" fill="#5fa6b6" font-size="9">SHIP / LEARN</text></g>
    <g transform="translate(42 330)"><rect width="176" height="58" rx="12" fill="#0a1a25" stroke="#1b5668"/><circle class="pulse" cx="18" cy="18" r="5" fill="#22d3ee"/><text class="sans" x="34" y="23" fill="#f8fafc" font-size="13" font-weight="650">MI SAES 2.0</text><text class="mono" x="18" y="44" fill="#5fa6b6" font-size="9">CHROME / IPN</text></g>
    <g transform="translate(272 330)"><rect width="176" height="58" rx="12" fill="#0a1a25" stroke="#1b5668"/><circle class="pulse b" cx="18" cy="18" r="5" fill="#22d3ee"/><text class="sans" x="34" y="23" fill="#f8fafc" font-size="13" font-weight="650">PRODUCTOS WEB</text><text class="mono" x="18" y="44" fill="#5fa6b6" font-size="9">TS / NEXT.JS</text></g>
    <g transform="translate(502 330)"><rect width="176" height="58" rx="12" fill="#0a1a25" stroke="#1b5668"/><circle class="pulse c" cx="18" cy="18" r="5" fill="#22d3ee"/><text class="sans" x="34" y="23" fill="#f8fafc" font-size="13" font-weight="650">AUTOMATIZACIÓN</text><text class="mono" x="18" y="44" fill="#5fa6b6" font-size="9">APIs / FLOWS</text></g>
  </g>
  <rect x=".75" y=".75" width="718.5" height="418.5" rx="23.25" fill="none" stroke="#1b5668" stroke-width="1.5"/>
</svg>
